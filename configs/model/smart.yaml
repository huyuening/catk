_target_: src.smart.model.smart.SMART
model_config:
  lr: 0.0005
  lr_warmup_steps: 0
  lr_total_steps: ${trainer.max_epochs}
  lr_min_ratio: 0.05
  n_rollout_closed_val: 32
  n_batch_wosac_metric: 10
  n_vis_batch: 2
  n_vis_scenario: 5
  n_vis_rollout: 5
  val_open_loop: true
  val_closed_loop: true
  wosac_backend: official # {official, fast}
  wosac_metrics_version: "2024"
  trajtok_root: ${oc.env:TRAJTOK_ROOT,/root/workspace/TrajTok}
  fast_wosac_gt_dir: null
  # Optional causal dynamics context reconstructed from raw 10 Hz history
  # during cache generation. Disabled by default for the original CatK model.
  history_dynamics:
    is_active: false
    # [signed longitudinal acceleration, angular speed, lateral acceleration]
    normalization_scale: [5.0, 1.0, 5.0]
    initial_gate: 1.0
  token_processor:
    map_token_file: "map_traj_token5.pkl"
    agent_token_file: "agent_vocab_555_s2.pkl"
    map_token_sampling: # open-loop
      num_k: 1 # for k nearest neighbors
      temp: 1.0 # uniform sampling
    agent_token_sampling: # closed-loop
      num_k: 1 # for k nearest neighbors
      temp: 1.0
  validation_rollout_sampling:
    criterium: topk_prob
    num_k: 5 # for k most likely
    temp: 1.0
  training_rollout_sampling:
    criterium: topk_prob # {topk_dist_sampled_with_prob, topk_prob, topk_prob_sampled_with_dist}
    num_k: -1 # for k nearest neighbors, set to -1 to turn-off closed-loop training
    temp: 1.0
  decoder:
    hidden_dim: 128
    num_freq_bands: 64
    num_heads: 8
    head_dim: 16
    dropout: 0.1
    hist_drop_prob: 0.1
    num_map_layers: 3
    num_agent_layers: 6
    pl2pl_radius: 10
    pl2a_radius: 30
    a2a_radius: 60
    time_span: 30
    num_historical_steps: 11
    num_future_steps: 80
    # Inference-only 2 Hz endpoint -> 10 Hz post-reconstruction from TrajTok.
    endpoint_interpolation:
      is_active: false
      method: global_cubic
      heading_method: endpoint_cubic
      min_segment_distance_m: 0.25
      heading_alignment_threshold_deg: 75.0
      moving_only: true
      moving_speed_threshold_mps: 0.5
      moving_segment_only: true
      moving_segment_speed_threshold_mps: 0.5
      low_speed_reconstruction: true
      low_speed_min_segment_threshold_mps: 0.1
      low_speed_heading_method: endpoint_smoothstep
      static_reconstruction: true
      static_max_segment_speed_threshold_mps: 0.5
      static_endpoint_span_threshold_m: 1.0
      static_pedestrian_max_segment_speed_threshold_mps: 0.2
      static_pedestrian_endpoint_span_threshold_m: 0.5
      static_cyclist_max_segment_speed_threshold_mps: 0.3
      static_cyclist_endpoint_span_threshold_m: 0.7
      smooth_output: true
      smooth_moving_agents_only: true
      xy_smoothing_window: 11
      xy_smoothing_iterations: 0
      heading_smoothing_window: 15
      heading_smoothing_iterations: 0
      smooth_preserve_start_steps: 5
      smooth_start_transition_steps: 5
  wosac_submission:
    is_active: false
    method_name: "SMART-tiny-CLSFT"
    authors: [Anonymous]
    affiliation: YOUR_AFFILIATION
    description: YOUR_DESCRIPTION
    method_link: YOUR_METHOD_LINK
    account_name: YOUR_ACCOUNT_NAME
  training_loss:
    use_gt_raw: true
    gt_thresh_scale_length: -1.0  # {"veh": 4.8, "cyc": 2.0, "ped": 1.0}
    label_smoothing: 0.1
    rollout_as_gt: false
    spatial_aware_smoothing: false
  finetune: false
