# @package _global_

defaults:
  # - override /trainer: ddp
  - override /model: smart

model:
  model_config:
    lr: 5e-4
    lr_min_ratio: 1e-2
    n_rollout_closed_val: 32
    n_batch_wosac_metric: -1
    val_open_loop: true
    val_closed_loop: true
    wosac_backend: fast
    wosac_metrics_version: "2025"
    fast_wosac_gt_dir: ${paths.validation_gt_dir}
    fast_wosac_require_preprocessed_gt: true
    validation_rollout_sampling:
      criterium: topk_prob
      num_k: 48
      temp: 1.0
    token_processor:
      map_token_sampling: # open-loop
        num_k: 1 # for k nearest neighbors
        temp: 1.0 # uniform sampling
      agent_token_sampling: # closed-loop
        num_k: 1 # for k nearest neighbors
        temp: 1.0
    training_loss:
      spatial_aware_smoothing: true

ckpt_path: null
# ckpt_path: CKPT_FOR_RESUME.ckpt # to resume training

trainer:
  limit_train_batches: 1.0
  limit_val_batches: 0.1
  check_val_every_n_epoch: 1
  # Paper: BC pre-training for 32 epochs.
  max_epochs: 32

data:
  train_batch_size: 10
  val_batch_size: 10
  test_batch_size: 10
  num_workers: 10
