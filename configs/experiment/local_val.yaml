# @package _global_

defaults:
  - override /model: smart

model:
  model_config:
    n_vis_batch: 0
    n_vis_scenario: 0
    n_vis_rollout: 0
    n_batch_wosac_metric: 100
    val_open_loop: false
    val_closed_loop: true
    validation_rollout_sampling:
      criterium: topk_prob
      num_k: 40 # paper local 2% validation setting
      temp: 1.0

ckpt_path: YOUR_MODEL.ckpt

trainer:
  limit_train_batches: 1.0
  # 55 batches * 16 scenarios = 880 scenarios (the paper's 2% split).
  limit_val_batches: 55
  limit_test_batches: 1.0
  check_val_every_n_epoch: 1
  accelerator: gpu
  devices: 1
  strategy: auto

data:
  train_batch_size: 16
  val_batch_size: 16
  test_batch_size: 16
  num_workers: 8

action: validate
